<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body style="margin:0;padding:20px;background:#f5f5f5;font-family:Arial,sans-serif">
<div style="max-width:560px;margin:0 auto;background:#fff;border-radius:8px;overflow:hidden">

    <div style="background:#FFA400;padding:20px 28px">
        <h2 style="margin:0;color:#fff;font-size:1.1rem;font-weight:bold">
            Nouvelle demande de contact PRO
        </h2>
    </div>

    <div style="padding:24px 28px">
        <table cellpadding="0" cellspacing="0" style="width:100%;border-collapse:collapse">
            <tr>
                <td style="font-weight:bold;color:#555;padding:8px 16px 8px 0;white-space:nowrap;vertical-align:top">Nom</td>
                <td style="padding:8px 0;color:#1a1a1a">{nom}</td>
            </tr>
            <tr style="background:#fafafa">
                <td style="font-weight:bold;color:#555;padding:8px 16px 8px 0;white-space:nowrap;vertical-align:top">Prénom</td>
                <td style="padding:8px 0;color:#1a1a1a">{prenom}</td>
            </tr>
            <tr>
                <td style="font-weight:bold;color:#555;padding:8px 16px 8px 0;white-space:nowrap;vertical-align:top">Société</td>
                <td style="padding:8px 0;color:#1a1a1a">{societe}</td>
            </tr>
            <tr style="background:#fafafa">
                <td style="font-weight:bold;color:#555;padding:8px 16px 8px 0;white-space:nowrap;vertical-align:top">Type de professionnel</td>
                <td style="padding:8px 0;color:#1a1a1a">{type}</td>
            </tr>
            <tr>
                <td style="font-weight:bold;color:#555;padding:8px 16px 8px 0;white-space:nowrap;vertical-align:top">Téléphone</td>
                <td style="padding:8px 0;color:#1a1a1a">{tel}</td>
            </tr>
            <tr style="background:#fafafa">
                <td style="font-weight:bold;color:#555;padding:8px 16px 8px 0;white-space:nowrap;vertical-align:top">Email</td>
                <td style="padding:8px 0"><a href="mailto:{email}" style="color:#FFA400">{email}</a></td>
            </tr>
            <tr>
                <td style="font-weight:bold;color:#555;padding:8px 16px 8px 0;white-space:nowrap;vertical-align:top">Adresse postale</td>
                <td style="padding:8px 0;color:#1a1a1a">{adresse}</td>
            </tr>
        </table>
    </div>

    <div style="padding:14px 28px;background:#f5f5f5;font-size:0.8rem;color:#999">
        Message envoyé depuis la landing page LP PRO – pro.cloture-discount.fr
    </div>
</div>
</body>
</html>
