<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Districlos – Maintenance en cours</title>
    <style>
        :root {
            --primary: #1f3c88;
            --secondary: #f5f7fb;
            --accent: #ffb703;
            --text: #1a1a1a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, var(--secondary), #ffffff);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: #fff;
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            animation: fadeIn 0.8s ease;
        }

        .logo {
            margin-bottom: 25px;
        }

        .logo span {
            display: inline-block;
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 1px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 15px;
            color: var(--primary);
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #555;
        }

        .badge {
            display: inline-block;
            padding: 10px 18px;
            background: rgba(255,183,3,0.15);
            color: #b97700;
            border-radius: 50px;
            font-weight: 600;
            margin-bottom: 25px;
        }

        .footer {
            margin-top: 30px;
            font-size: 14px;
            color: #777;
        }

        .footer strong {
            color: var(--primary);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 24px;
            }

            p {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">
        <span>Districlos</span>
    </div>

    <div class="badge">🚧 Maintenance en cours</div>

    <h1>Nous revenons très bientôt</h1>

    <p>
        Notre site est actuellement en maintenance afin d'améliorer ses performances
        et votre expérience.
    </p>

    <p>
        Merci pour votre patience 🙏<br>
        Nos équipes font le maximum pour un retour rapide.
    </p>

    <div class="footer">
        © <strong>Districlos</strong> – Votre partenaire clôtures & extérieurs
    </div>
</div>
</body>
</html>
